<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oddsouls — проекты</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #eaeaea;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrap {
      max-width: 760px;
      width: 100%;
    }
    .head {
      text-align: center;
      margin-bottom: 40px;
    }
    .brand {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #e94560, #ff6b9d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .tagline {
      color: #a0a0b8;
      font-size: 15px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 28px 24px;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(233, 69, 96, 0.35);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
    }
    .emoji {
      font-size: 30px;
      margin-bottom: 12px;
    }
    .name {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .desc {
      color: #9090a8;
      font-size: 13px;
      line-height: 1.5;
    }
    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      color: #606078;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="brand">oddsouls</div>
      <div class="tagline">наши проекты</div>
    </div>

    <div class="grid">
      <a class="card" href="/oddsouls/">
        <div class="emoji">💔➡️💞</div>
        <div class="name">Odd Souls Dates</div>
        <div class="desc">Каталог неординарных людей для знакомств. Android · APK</div>
      </a>

      <a class="card" href="https://github.com/oddsouls/cryptosa">
        <div class="emoji">📊</div>
        <div class="name">cryptosa</div>
        <div class="desc">Polygon DEX арбитраж-сканер. Лендинг и APK</div>
      </a>

      <a class="card" href="/xyz/">
        <div class="emoji">🎙️</div>
        <div class="name">xyz</div>
        <div class="desc">Голосовой диктофон. Android · APK</div>
      </a>
    </div>

    <div class="footer">oddsouls.github.io</div>
  </div>
</body>
</html>
